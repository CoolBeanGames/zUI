<!DOCTYPE html>
<html lang="en" data-zui-theme="holo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zUI</title>
<link rel="stylesheet" href="../core/css/zui.css">
<link rel="stylesheet" href="../core/css/themes/holo.css">
</head>
<body>
<div class="zui-window"><div class="zui-titlebar"><span>Counter</span></div><div class="zui-panel"><div class="zui-panel__header">Counter</div><div class="zui-panel__body zui-panel__body--flush"><div class="zui-row zui-gap-2"><button class="zui-btn" id="z1">-</button><span id="t2"></span><button class="zui-btn zui-btn--primary" id="z3">+</button></div></div></div></div>
<script>window.__zslState = {"count": 0};</script>
<script src="../core/js/zui.js"></script>
<script>
(function(){
  var state = window.__zslState;
  var _el_z1 = document.getElementById("z1");
  if (_el_z1) _el_z1.addEventListener('click', function(){
    state["count"] = ((state["count"]||0)-1);
    zui.send("count", state["count"]);
    render();
  });
  var _el_z3 = document.getElementById("z3");
  if (_el_z3) _el_z3.addEventListener('click', function(){
    state["count"] = ((state["count"]||0)+1);
    zui.send("count", state["count"]);
    render();
  });
  function render(){
    var et2=document.getElementById("t2"); if(et2) et2.textContent = state["count"];
  }
  zui.receive('state', function(p){ Object.assign(state, p||{}); render(); });
  document.addEventListener('DOMContentLoaded', function(){ zui.wire(document); render(); });
})();
</script>
</body>
</html>
