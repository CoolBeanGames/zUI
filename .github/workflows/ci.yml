name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }

      # ---- python: compiler + token tests -------------------------------
      - name: compiler tests
        run: python compiler/tests/test_compile.py
      - name: token check
        run: python tests/check-tokens.py
      - name: runtime self-tests (headless)
        shell: pwsh
        run: |
          $chrome = (Get-Command chrome, msedge -ErrorAction SilentlyContinue |
                     Select-Object -First 1).Source
          if (-not $chrome) { $chrome = "$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe" }
          foreach ($t in @(
              @{ f = 'tests/io-selftest.html';  m = 'IO SELFTEST OK' },
              @{ f = 'tests/nav-selftest.html'; m = 'NAV SELFTEST OK' })) {
            $dom = & $chrome --headless --disable-gpu --virtual-time-budget=6000 --dump-dom `
                   ("file:///" + (Resolve-Path $t.f).Path.Replace('\','/'))
            if ($dom -notmatch $t.m) { throw "self-test failed: $($t.f)" }
            Write-Host "ok  $($t.f)"
          }

      # ---- C# binding + sample ----------------------------------------
      - name: build C# binding
        run: dotnet build bindings/csharp/ZUI.csproj -c Release
      - name: build C# sample
        run: dotnet build samples/csharp/ZuiSample.csproj -c Release

      # ---- C++ pure core (no WebView2) - required ---------------------
      - name: build + test C++ core
        shell: pwsh
        run: |
          cmake -S bindings/cpp -B build/cpp -DZUI_BUILD_TESTS=ON
          cmake --build build/cpp --config Release
          ctest --test-dir build/cpp -C Release --output-on-failure

      # ---- C++ WebView2 backend + sample --------------------------
      - name: fetch WebView2 SDK + WIL
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2478.35 -OutputDirectory pkgs -ExcludeVersion
          nuget install Microsoft.Windows.ImplementationLibrary -Version 1.0.240122.1 -OutputDirectory pkgs -ExcludeVersion
      - name: build C++ WebView2 sample
        id: cppsample
        continue-on-error: true
        shell: pwsh
        run: |
          $wv2 = "$PWD/pkgs/Microsoft.Web.WebView2"
          $wil = "$PWD/pkgs/Microsoft.Windows.ImplementationLibrary"
          cmake -S samples/cpp -B build/sample-cpp "-DWEBVIEW2_DIR=$wv2" "-DWIL_DIR=$wil" 2>&1 | Tee-Object cpp-build.log
          cmake --build build/sample-cpp --config Release 2>&1 | Tee-Object -Append cpp-build.log
          exit $LASTEXITCODE
      - name: upload C++ build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-build-log
          path: cpp-build.log
          if-no-files-found: ignore
      - name: publish C++ build log (diagnosis)
        if: steps.cppsample.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Get-Content cpp-build.log -Raw
          $body = "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n`n" +
                  "``````" + "`n" + ($log.Substring([Math]::Max(0, $log.Length - 12000))) + "`n" + "``````"
          $payload = @{ title = "CI diag: C++ WebView2 build ($env:GITHUB_SHA)"; body = $body } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "Accept" = "application/vnd.github+json" } `
            -Body $payload
      - name: fail if C++ sample failed
        if: steps.cppsample.outcome == 'failure'
        run: exit 1
